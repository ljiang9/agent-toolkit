[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
description = "可扩展的 AI agent 工具注册与调度层：对齐 Anthropic agent loop 与 OpenAI function calling 规范"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ljiang9" }]
keywords = ["agent", "llm", "function-calling", "tool-registry", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# 运行时零第三方依赖 —— 只用标准库，保证最小可用体积与长期可维护
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
]

[project.urls]
Homepage = "https://github.com/ljiang9/agent-toolkit"
Repository = "https://github.com/ljiang9/agent-toolkit"

[tool.setuptools.packages.find]
include = ["agent_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
