[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahacks"
version = "0.1.0"
description = "纯标准库的命令行数据分析工具集：直方图、分位数、频次、去重、抽样、哈希"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ljiang9" }]
keywords = ["data-analysis", "histogram", "quantile", "cli", "statistics", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# 关键卖点：运行时零第三方依赖，纯标准库实现
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
]
agent = ["agent-core>=0.1.0"]

[project.scripts]
datahacks = "datahacks.cli:main"

[project.entry-points.agent_tools]
datahacks = "datahacks.agent:register"

[tool.setuptools.packages.find]
include = ["datahacks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
