[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snakevision"
version = "0.1.0"
description = "会自己玩的终端贪吃蛇：BFS/A* 寻路 + 三级存活策略 + 双缓冲 ANSI 渲染。复刻自 sssnake"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ljiang9" }]
keywords = ["pathfinding", "astar", "bfs", "screensaver", "ansi", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Arcade",
]

# 渲染与寻路全部用标准库，无需 curses 之外的依赖
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
]
agent = ["agent-core>=0.1.0"]

[project.scripts]
snakevision = "snakevision.cli:main"

[project.entry-points.agent_tools]
snakevision = "snakevision.agent:register"

[tool.setuptools.packages.find]
include = ["snakevision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
