[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formcodec"
version = "0.1.0"
description = "结构体与表单/查询参数的双向编解码，自动类型转换与嵌套结构还原。复刻自 go-playground/form"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ljiang9" }]
keywords = ["form", "urlencoded", "codec", "serialization", "dataclass", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
]
agent = ["agent-core>=0.1.0"]

[project.scripts]
formcodec = "formcodec.cli:main"

[project.entry-points.agent_tools]
formcodec = "formcodec.agent:register"

[tool.setuptools.packages.find]
include = ["formcodec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
