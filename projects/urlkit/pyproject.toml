[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urlkit"
version = "0.1.0"
description = "URL 结构化编解码工具：解析、按组件改写、归一化、去重指纹与安全检查。复刻自 curl/trurl"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ljiang9" }]
keywords = ["url", "parser", "normalize", "fingerprint", "ssrf", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]

# urlkit 本身零第三方依赖
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<1.0",
]

# 与 agent-core 的联动是可选的：不装也能当独立 CLI 用
agent = ["agent-core>=0.1.0"]

[project.scripts]
urlkit = "urlkit.cli:main"

# agent 工具注册入口：agent-core 通过此协议自动发现 urlkit
[project.entry-points.agent_tools]
urlkit = "urlkit.agent:register"

[tool.setuptools.packages.find]
include = ["urlkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
